name: iOS (.ipa assinado)

# Gera um .ipa JÁ ASSINADO usando o seu certificado de distribuição Apple.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   IOS_CERT_P12           certificado .p12 em base64   (base64 -i cert.p12 | pbcopy)
#   IOS_CERT_PASSWORD      senha do .p12
#   IOS_PROFILE            provisioning profile .mobileprovision em base64
#   IOS_KEYCHAIN_PASSWORD  senha qualquer, só para o keychain temporário do runner
#
# Nunca envie o .p12 por chat: coloque direto nos Secrets do repositório.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Método de distribuição"
        type: choice
        options: [ad-hoc, development, app-store]
        default: ad-hoc
      bundle_id:
        description: "Bundle ID (precisa bater com o App ID do profile)"
        required: true
        default: com.sysarchx.tubefetch
      team_id:
        description: "Team ID (Apple Developer → Membership)"
        required: true
      profile_name:
        description: "Nome exato do provisioning profile"
        required: true

concurrency:
  group: ios-ipa-signed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-signed-ipa:
    name: Build + assinatura (${{ inputs.export_method }})
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Checar secrets
        run: |
          set -eu
          missing=""
          [ -n "${{ secrets.IOS_CERT_P12 }}" ] || missing="$missing IOS_CERT_P12"
          [ -n "${{ secrets.IOS_CERT_PASSWORD }}" ] || missing="$missing IOS_CERT_PASSWORD"
          [ -n "${{ secrets.IOS_PROFILE }}" ] || missing="$missing IOS_PROFILE"
          if [ -n "$missing" ]; then
            echo "::error::Faltam secrets:$missing"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Importar certificado e profile
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -eux
          KC_PASS="${KEYCHAIN_PASSWORD:-temp-$RANDOM-$RANDOM}"
          security create-keychain -p "$KC_PASS" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KC_PASS" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain

          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KC_PASS" build.keychain >/dev/null

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > /tmp/profile.mobileprovision
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/profile.plist)
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

          echo "=== Profile ==="
          /usr/libexec/PlistBuddy -c 'Print :Name' /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /tmp/profile.plist
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/profile.plist
          DEVICES=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' /tmp/profile.plist 2>/dev/null | grep -c "UDID" || true)
          echo "UDIDs no profile: $DEVICES"
          if [ "${{ inputs.export_method }}" = "ad-hoc" ] && [ "$DEVICES" -eq 0 ]; then
            echo "::error::Profile de Ad Hoc sem aparelhos registrados. Cadastre o UDID do iPhone em developer.apple.com e baixe o profile de novo."
            exit 1
          fi

          echo "Identidades disponíveis:"
          security find-identity -v -p codesigning build.keychain

      - name: Ajustar bundle id / assinatura manual
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TEAM_ID: ${{ inputs.team_id }}
          PROFILE_NAME: ${{ inputs.profile_name }}
        run: |
          set -eux
          cd app
          python3 - <<'PY'
          import os, re, pathlib

          bundle = os.environ["BUNDLE_ID"]
          team = os.environ["TEAM_ID"]
          profile = os.environ["PROFILE_NAME"]

          p = pathlib.Path("ios/Runner.xcodeproj/project.pbxproj")
          s = p.read_text()
          s = s.replace("com.sysarchx.tubefetch.RunnerTests", bundle + ".RunnerTests")
          s = s.replace("com.sysarchx.tubefetch", bundle)


          def setkv(text, key, value):
              if re.search(rf"{re.escape(key)} = [^;]+;", text):
                  return re.sub(rf"{re.escape(key)} = [^;]+;", f"{key} = {value};", text)
              return text.rstrip() + f"\n\t\t\t\t{key} = {value};"


          def fix(m):
              inner = m.group(2)
              inner = setkv(inner, "CODE_SIGN_STYLE", "Manual")
              inner = setkv(inner, "DEVELOPMENT_TEAM", team)
              inner = setkv(inner, "PROVISIONING_PROFILE_SPECIFIER", f'"{profile}"')
              return m.group(1) + inner + m.group(3)

          s = re.sub(r"(buildSettings = \{)(.*?)(\n\t\t\t\};)", fix, s, flags=re.S)
          # identidade de distribuição para assinatura manual
          s = s.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Developer";',
                        '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";')
          s = s.replace('"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Development";',
                        '"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "iPhone Distribution";')
          p.write_text(s)
          print("bundle id:", bundle, "team:", team, "profile:", profile)
          PY
          grep -c "PROVISIONING_PROFILE_SPECIFIER" ios/Runner.xcodeproj/project.pbxproj

      - name: Dependências
        working-directory: app
        run: flutter pub get

      - name: ExportOptions
        working-directory: app
        env:
          METHOD: ${{ inputs.export_method }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          TEAM_ID: ${{ inputs.team_id }}
          PROFILE_NAME: ${{ inputs.profile_name }}
        run: |
          # Xcode 15.4+ renomeou os métodos de exportação.
          case "$METHOD" in
            ad-hoc) XCODE_METHOD="release-testing" ;;
            development) XCODE_METHOD="debugging" ;;
            app-store) XCODE_METHOD="app-store-connect" ;;
            *) XCODE_METHOD="$METHOD" ;;
          esac
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${XCODE_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>compileBitcode</key><false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF
          plutil -lint ExportOptions.plist
          cat ExportOptions.plist

      - name: Build .ipa assinado
        working-directory: app
        run: |
          set -eux
          flutter build ipa --release --export-options-plist=ExportOptions.plist

      - name: Conferir assinatura
        working-directory: app
        run: |
          set -eux
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA: $IPA"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          unzip -q -o "$IPA" -d /tmp/chk
          codesign -dv --verbose=4 /tmp/chk/Payload/*.app 2>&1 | head -20
          codesign --verify --deep --strict /tmp/chk/Payload/*.app && echo "assinatura OK"
          ls /tmp/chk/Payload/*.app/embedded.mobileprovision && echo "profile embutido OK"
          shasum -a 256 "$IPA" | tee "$IPA.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: TubeFetch-ios-signed-${{ inputs.export_method }}
          path: |
            app/build/ios/ipa/*.ipa
            app/build/ios/ipa/*.sha256
          if-no-files-found: error
          retention-days: 30
